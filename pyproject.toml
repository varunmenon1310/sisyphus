[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sisyphus-qec"
version = "0.1.0"
description = "Sisyphus: fast randomized search for the minimum distance of CSS quantum codes and circuit-level detector error models"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "numba>=0.58", "scipy>=1.10"]

[project.optional-dependencies]
circuits = ["stim>=1.12"]
test = ["pytest", "stim>=1.12"]

[tool.setuptools]
packages = ["sisyphus_qec"]
